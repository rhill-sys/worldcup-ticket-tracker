name: Track ticket prices

on:
  schedule:
    # Runs every day at 13:00 UTC (~9am ET). Adjust the cron if you like.
    - cron: "0 13 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # allows the job to commit updated data back

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          STUBHUB_API_TOKEN: ${{ secrets.STUBHUB_API_TOKEN }}
        run: python tracker.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/history.csv docs/data/latest.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ticket prices ($(date -u +%Y-%m-%d))"
            git push
          fi
